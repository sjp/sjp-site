  <title id="gridsvg-diagram-title">How gridSVG differs from the built-in SVG device</title>
  <desc id="gridsvg-diagram-desc">The graphics and grid packages both draw through grDevices, which writes the svg and pdf output. grid can instead draw through gridSVG, which creates the SVG image directly rather than going via grDevices.</desc>
  <style>
    /* Standalone only: `:root` matches when this file is the document
       (opened directly, or used as an image source) and never when it has
       been inlined into a page -- an inlined copy inherits the page colour. */
    .diagram--gridsvg-diagram:root { color: #313131; background: #fff; }
    @media (prefers-color-scheme: dark) {
      .diagram--gridsvg-diagram:root { color: #ccc; background: #1b1b1b; }
    }

    .diagram--gridsvg-diagram text {
      fill: currentColor;
      font-family: "PT Sans", system-ui, -apple-system, "Segoe UI", Roboto,
                   "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 16px;
      text-anchor: middle;
    }

    .diagram--gridsvg-diagram .node rect { fill: none; stroke: currentColor; stroke-width: 1.25px; }
    .diagram--gridsvg-diagram .flowchart-link { fill: none; stroke: currentColor; stroke-width: 1.25px; }
    .diagram--gridsvg-diagram .marker { fill: currentColor; stroke: none; }
  </style>
