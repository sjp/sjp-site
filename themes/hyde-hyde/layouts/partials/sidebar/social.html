<section class="social">
    {{ with .Site.Params.social.github }}
    <a href="https://github.com/{{.}}" rel="me" title="GitHub"><i class="icon icon-github-circled" aria-hidden="true"></i></a>
    {{ end }}
    {{ with .Site.Params.social.email }}
    <a href="mailto:{{.}}" rel="me" title="Email"><i class="icon icon-at" aria-hidden="true"></i></a>
    {{ end }}
    <label for="theme-toggle" title="Toggle Dark Mode"><i class="icon icon-lightbulb" aria-hidden="true"></i></label>
</section>
